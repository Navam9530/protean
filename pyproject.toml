[project]
name = "protean"
version = "0.1.0"
description = "A versatile harness for Engineers"
readme = "README.md"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSE-APACHE", "LICENSE-MIT"]
authors = [
    { name = "Nava Teja", email = "mushamnavam9530@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
protean = "protean.app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
